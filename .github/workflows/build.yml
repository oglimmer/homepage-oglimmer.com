name: Build & push image

# Builds the homepage Docker image and pushes it to registry.oglimmer.com via
# the repo's oglimmer.sh script, on the in-cluster self-hosted ARC runner
# (arm64, Docker-in-Docker). The runner has no kubectl, so oglimmer.sh triggers
# the rollout through the restart hook (restart.oglimmer.com) using the
# RESTART_TOKEN secret passed in the environment.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build per ref; cancel superseded pushes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  homepage:
    runs-on: arc-homepage   # in-cluster ARC runner scale set
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Log in to registry.oglimmer.com
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: registry.oglimmer.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # --platform auto -> plain `docker build` + `docker push` via the dind
      # daemon (native arm64). Avoids the buildx docker-container driver, whose
      # push session times out against the registry's public ingress.
      # (oglimmer.sh defaults PLATFORM=arm64/buildx, so --platform auto is required.)
      # No kubectl on the runner, so the rollout goes through the restart hook.
      - name: Build, push & restart homepage
        env:
          RESTART_TOKEN: ${{ secrets.RESTART_TOKEN }}
        run: ./oglimmer.sh build --platform auto --verbose
